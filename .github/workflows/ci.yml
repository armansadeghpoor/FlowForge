name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flowforge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore FlowForge.slnx

      - name: Build solution
        run: dotnet build FlowForge.slnx --configuration Release --no-restore

      - name: Run solution tests
        env:
          FLOWFORGE_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=flowforge;Username=postgres;Password=postgres
        run: >-
          dotnet test FlowForge.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger trx
          --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
